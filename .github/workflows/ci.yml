# SPDX-License-Identifier: Apache-2.0
#
# The gates the owner runs locally (scripts/linux-gates.sh, plus cargo-deny,
# which that script leaves to the host, and the Docker-isolated web checks),
# on GitHub-hosted Ubuntu 24.04. Actions are
# pinned by commit SHA (resolved 2026-10-27 from their v4 / v2 tags;
# re-checked 2026-10-31 with git ls-remote: actions/checkout v4 = v4.4.0
# 11d5960a, actions/upload-artifact v4 = v4.6.2 ea165f8d,
# EmbarkStudios/cargo-deny-action v2 = v2.1.1 3c634983, which installs
# cargo-deny 0.20.2). The repo has been public since 2026-11-03.
#
# Both jobs were reproduced locally in Docker on 2026-10-31 (fresh depth-1
# clone, no in-docker.sh mounts: the tests find contracts/ and research/
# at ../../ from apps/web): rust in the ubuntu:24.04 digest of
# scripts/linux-gates.sh as a non-root user; web in the image below as
# root with HOME=/github/home owned by the runner, as GitHub runs a
# container job. cargo-deny ran as the same release (0.20.2) with the
# action's arguments inside that Ubuntu container; the action's own Alpine
# container was not reproduced. The web job was reproduced at 4 vCPU / 16 GB
# and at 2 vCPU / 7 GB: at 2 vCPU with 4 workers a WebKit focus test
# fails, so Playwright runs with 2 workers (2 vCPU / 7 GB, 2 workers:
# 501 passed, about 1 h, on the tree of that date).
name: ci

on:
  push:
    branches: [main, feat/public-portal]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust gates (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install 1.99.1 --profile default && rustup show
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo deny (licenses, advisories, bans, sources; deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          rust-version: "1.99.1"
      - name: test
        run: cargo test --workspace --locked
      - name: evaluate (scripted protocol conformance)
        run: cargo run -q -p consensus-tests --example evaluate
      - name: demo crate
        run: cargo test --manifest-path demo-repo/payment-client/Cargo.toml --locked
      - name: tooling self-tests (snapshot manifest tool; capture script under dash; baseline driver)
        run: |
          python3 -I scripts/snapshot_manifest.py selftest
          python3 -I scripts/baseline_battery.py selftest
          sh -n scripts/hyphae-container/capture-snapshot.sh
          sh scripts/hyphae-container/capture-snapshot.sh --selftest

  web:
    name: web checks (apps/web)
    runs-on: ubuntu-24.04
    # Browsers come only from this image, pinned by digest (Playwright 1.64.1).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable the pinned pnpm (package.json packageManager)
        run: corepack enable pnpm && pnpm --version
      - name: Install (frozen lockfile, build scripts denied by policy)
        run: pnpm install --frozen-lockfile
      - name: Theme, typecheck, lint, unit tests, static export, CSP manifest
        run: pnpm check
      # pnpm check runs Vitest before the build, so the scan of the built CSS
      # (tests/radius-scan.test.ts, runIf out/ exists) is skipped there on a
      # fresh checkout; run it again over the export just built. Fail if the
      # export is missing, so the scan can never be skipped here silently.
      - name: Radius scan of the built CSS (needs out/)
        run: |
          test -d out
          pnpm exec vitest run tests/radius-scan.test.ts
      - name: Playwright + axe
        if: ${{ hashFiles('apps/web/playwright.config.ts') != '' }}
        # GitHub runs the container as root with HOME=/github/home, owned by
        # the runner user; Firefox then refuses to start ("Running Nightly as
        # root in a regular user's session is not supported") and every
        # firefox @smoke test fails at launch. Playwright's documented
        # workaround: HOME=/root for this step. In the local reproduction at
        # 2 vCPU / 7 GB the config's default of 4 workers made a WebKit focus
        # test (e2e/navigation.spec.ts) time out; 2 workers passed at 2 vCPU
        # and at 4 vCPU. This file does not assert the size of the hosted
        # runner; the step runs 2 workers whatever it is.
        env:
          HOME: /root
          PW_WORKERS: "2"
        run: pnpm exec playwright test
      # The config's reporters are list and json; traces, screenshots, the
      # JSON report and the axe results all land in test-results/ (there is
      # no playwright-report/ directory).
      - name: Keep the Playwright results
        if: ${{ always() && hashFiles('apps/web/playwright.config.ts') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
