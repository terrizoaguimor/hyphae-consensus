[package]
name = "consensus-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Public API, operator surface, Meta and Hyphae adapters, SSE streaming, verify CLI."

[dependencies]
consensus-domain = { path = "../consensus-domain" }
consensus-runtime = { path = "../consensus-runtime" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
chrono.workspace = true
reqwest.workspace = true
axum.workspace = true
futures-core.workspace = true
async-stream.workspace = true
tokio.workspace = true
sha2.workspace = true
uuid.workspace = true
# Session ids and operator tokens: 256 bits straight from the OS. Already
# in Cargo.lock through uuid.
getrandom = "=0.4.3"
# The request timeout layer (`timeout`), and `ServiceExt::oneshot` for the
# HTTP-level tests (`util`). Already in Cargo.lock through axum.
tower = { version = "=0.5.3", default-features = false, features = ["util", "timeout"] }

[dev-dependencies]
# HTTP-level tests read bodies with `http_body_util::BodyExt`; already in
# Cargo.lock through axum.
http-body-util = "=0.1.5"
