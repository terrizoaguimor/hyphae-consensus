# /etc/needrestart/conf.d/90-consensus.conf (root:root 0644): needrestart
# lists consensus-public, consensus-operator and cloudflared as pending after
# a library upgrade but never restarts them itself. A restart in the middle of
# a live model call costs a settled attempt, and one that systemd has to kill
# strands the run's reservation; consensus-public is restarted only through
# deploy/scripts/restart-when-idle.sh, and cloudflared by the owner
# (runbook 9.9, 9.10). Patching freeze until 2026-11-05T02:00Z (runbook 9.10).
# Check: `sudo needrestart -b -r l` lists the services as pending, and
# `systemctl show consensus-public -p NRestarts -p ExecMainStartTimestamp` is
# unchanged after it.
$nrconf{override_rc}{qr(^consensus-)} = 0;
$nrconf{override_rc}{qr(^cloudflared)} = 0;
