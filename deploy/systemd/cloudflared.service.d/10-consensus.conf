# Drop-in for the cloudflared.service that `cloudflared service install`
# writes to /etc/systemd/system/cloudflared.service (the packaged unit is
# not edited). Install as
# /etc/systemd/system/cloudflared.service.d/10-consensus.conf, then
# `systemctl daemon-reload && systemctl restart cloudflared`.
#
# Purpose: run cloudflared as the unprivileged user `cloudflared`, member of
# the supplementary group `consensus`, so that it can traverse /run/consensus
# (0750 consensus:consensus) and connect to public.sock (0660). Without this
# drop-in the packaged unit runs as root, which reaches the socket too but
# makes the socket's group and mode meaningless. /etc/cloudflared/ must be
# readable by this user (root:cloudflared 0750, files 0640): runbook 6.3.

[Service]
User=cloudflared
Group=cloudflared
SupplementaryGroups=consensus
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
