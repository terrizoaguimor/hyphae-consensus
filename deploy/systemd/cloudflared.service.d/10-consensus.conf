# Drop-in for the cloudflared.service that `cloudflared service install`
# writes to /etc/systemd/system/cloudflared.service (the packaged unit is
# not edited). Install as
# /etc/systemd/system/cloudflared.service.d/10-consensus.conf, then
# `systemctl daemon-reload && systemctl restart cloudflared`.
#
# Purpose: run cloudflared, the only internet-facing process on the host,
# as the unprivileged user `cloudflared` whose single extra group is
# `consensus-sock`: the group that owns nothing but the socket directory
# /run/consensus (2750 consensus:consensus-sock, from
# deploy/tmpfiles.d/consensus.conf) and the socket public.sock (0660,
# group inherited from the setgid directory). cloudflared is NOT a member of
# `consensus`: that group reads /etc/consensus (env files, judge digests)
# and, through the service user, the snapshot's private witnesses. Without
# this drop-in the packaged unit runs as root, which reaches the socket too
# but makes the socket's group and mode meaningless. /etc/cloudflared/ must
# be readable by this user (root:cloudflared 0750, files 0640): runbook 6.3.

[Service]
User=cloudflared
Group=cloudflared
SupplementaryGroups=consensus-sock
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
