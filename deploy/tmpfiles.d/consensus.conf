# tmpfiles.d(5) entry for the public server's socket directory. Install as
# /etc/tmpfiles.d/consensus.conf (root:root 0644). systemd-tmpfiles applies
# it at boot (systemd-tmpfiles-setup.service, before any service starts) and
# `systemd-tmpfiles --create /etc/tmpfiles.d/consensus.conf` applies it now
# (install.sh does). Runbook: docs/deployment/runbook.md, sections 2.3 and 5.1.
#
# Mode 2750: owner consensus (the server binds public.sock here and removes
# a stale one), group consensus-sock with search permission (cloudflared
# traverses the directory), setgid so that the socket inherits the group
# consensus-sock: a node created in a set-group-ID directory "will inherit
# the group ownership from its parent directory" (mknod(2)). The server then
# sets the socket to 0660, so exactly two principals can connect: the
# service user and the members of consensus-sock (cloudflared).
# No age: nothing in this directory is cleaned up by time.
#Type Path            Mode User      Group          Age Argument
d     /run/consensus  2750 consensus consensus-sock -   -
